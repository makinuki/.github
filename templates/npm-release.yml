# Canonical npm release workflow template for MakiNuki package repos.
# Copy this file into <repo>/.github/workflows/release.yml and adjust the
# marked lines. Publishing deliberately lives in each repository instead
# of a reusable org workflow: npm Trusted Publishing (OIDC) validates the
# exact workflow filename that runs `npm publish`, and indirection through
# workflow_call is a documented source of identity mismatches.
#
# One-time setup per package:
#   1. On npmjs.com, open the package settings (…/<name>/access), add a
#      Trusted Publisher: owner "makinuki", the repo name, workflow file
#      name "release.yml".
#   2. Ensure package.json carries repository.url and
#      publishConfig: { access: "public", provenance: true }.
#
# Release flow (see scripts/release.* per repo):
#   cut the release locally, then `git push --follow-tags origin master`.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node-package repos using pnpm keep these two actions; repos with
      # no dependencies may drop pnpm/action-setup and install entirely.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # ADJUST: project checks go here (typecheck, test).

      - run: pnpm install --frozen-lockfile

      # ADJUST: choose one publish line.
      - run: pnpm publish --access public --provenance --no-git-checks
      # - run: npm publish --access public
